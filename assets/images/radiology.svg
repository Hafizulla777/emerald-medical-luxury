<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="radGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#063F3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#087F73;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="radGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#C6A66B;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#C6A66B;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#radGrad)" />
  <circle cx="300" cy="200" r="100" fill="url(#radGlow)" />
  <rect x="150" y="100" width="300" height="200" fill="#FFFFFF" opacity="0.1" rx="8" />
  <circle cx="300" cy="200" r="75" fill="none" stroke="#C6A66B" stroke-width="2" />
  <circle cx="300" cy="200" r="35" fill="#C6A66B" opacity="0.3" />
  <circle cx="300" cy="200" r="12" fill="#C6A66B" />
  <circle cx="240" cy="160" r="8" fill="#FFFFFF" opacity="0.6" />
  <circle cx="360" cy="240" r="8" fill="#FFFFFF" opacity="0.6" />
  <text x="300" y="330" font-family="Playfair Display, serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Radiology</text>
  <text x="300" y="360" font-family="Inter, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" opacity="0.8">Imaging</text>
</svg>